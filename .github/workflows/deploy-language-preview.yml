name: Deploy English portfolio preview

on:
  push:
    branches:
      - language-preview
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Retrieve exact current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"
          curl --fail --location --retry 3 "${base}/index.html" --output index.html
          curl --fail --location --retry 3 "${base}/script.js" --output script.js
          curl --fail --location --retry 3 "${base}/styles.css" --output styles.css
          curl --fail --location --retry 3 "${base}/category-pages.css" --output category-pages.css
          curl --fail --location --retry 3 "${base}/favicon.svg" --output favicon.svg
          curl --fail --location --retry 3 "${base}/robots.txt" --output robots.txt

      - name: Download every local asset referenced by the live site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request
          import urllib.parse

          base = 'https://sayedabdallah.pages.dev/'
          source_files = ['index.html', 'script.js', 'styles.css', 'category-pages.css']
          refs = set()

          for filename in source_files:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))

          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              url = urllib.parse.urljoin(base, ref)
              print(f'Downloading {ref}')
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)

          missing = [ref for ref in sorted(refs) if not Path(ref).exists() or Path(ref).stat().st_size == 0]
          if missing:
              raise RuntimeError('Missing assets: ' + ', '.join(missing))
          print(f'Validated {len(refs)} local assets.')
          PY

      - name: Validate English site files
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          if grep -q "i18n-preview" index.html; then
            echo "Unexpected language-preview code found in index.html"
            exit 1
          fi
          if grep -q "language-switcher" index.html; then
            echo "Unexpected language switcher found in live HTML"
            exit 1
          fi

      - name: Deploy English preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=language-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
