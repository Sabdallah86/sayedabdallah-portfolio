name: Deploy English portfolio preview

on:
  push:
    branches:
      - language-preview
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Retrieve exact current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"
          curl --fail --location --retry 3 "${base}/index.html" --output index.html
          curl --fail --location --retry 3 "${base}/script.js" --output script.js
          curl --fail --location --retry 3 "${base}/styles.css" --output styles.css
          curl --fail --location --retry 3 "${base}/category-pages.css" --output category-pages.css
          curl --fail --location --retry 3 "${base}/favicon.svg" --output favicon.svg
          curl --fail --location --retry 3 "${base}/robots.txt" --output robots.txt

      - name: Download valid local assets from live site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse

          base = 'https://sayedabdallah.pages.dev/'
          # These two old Qowa paths are broken on production and are replaced
          # with the original YouTube video before this preview is deployed.
          skip = {
              'assets/hospital-57357-qewa-fi-alby.webp',
              'assets/hospital-57357-qewa-fi-alby.mp4',
          }
          refs = set()
          for filename in ['index.html', 'script.js', 'styles.css', 'category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))
          refs -= skip

          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)
          print(f'Downloaded {len(refs)} valid local assets.')
          PY

      - name: Restore requested YouTube videos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          ABU_ID = 'hyYa8IUSJJc'
          QOWA_ID = '2KVyASYThgw'

          # ---- Homepage / Selected Work ----
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          abu_changes = 0
          replacements = [
              ('data-video="assets/abu-el-arousa.mp4"', f'data-youtube="{ABU_ID}"'),
              ('data-poster="assets/abu-el-arousa.webp"\n          ', ''),
              ('data-title="Abu Al-Arousa — Season 2"', 'data-title="Abu Al-Arousa — Haytan Beitna"'),
              ('aria-label="Play Abu Al-Arousa Season 2 video"', 'aria-label="Play Abu Al-Arousa Haytan Beitna video"'),
              ('src="assets/abu-el-arousa.webp" alt="Abu Al-Arousa Season 2 editing project"', f'src="https://i.ytimg.com/vi/{ABU_ID}/hqdefault.jpg" alt="Abu Al-Arousa Haytan Beitna song edited by Sayed Abdallah"'),
              ('<h3>Abu Al-Arousa — Season 2</h3><p>TV Series · Video Editing</p>', '<h3>Abu Al-Arousa — Haytan Beitna</h3><p>Series Song · Video Editing</p>'),
          ]
          for old, new in replacements:
              if old in html:
                  html = html.replace(old, new, 1)
                  abu_changes += 1

          qowa_changes = 0
          replacements = [
              ('data-video="assets/hospital-57357-qewa-fi-alby.mp4"', f'data-youtube="{QOWA_ID}"'),
              ('data-poster="assets/hospital-57357-qewa-fi-alby.webp"\n          ', ''),
              ('src="assets/hospital-57357-qewa-fi-alby.webp" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"', f'src="https://i.ytimg.com/vi/{QOWA_ID}/hqdefault.jpg" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"'),
          ]
          for old, new in replacements:
              if old in html:
                  html = html.replace(old, new, 1)
                  qowa_changes += 1

          if f'data-youtube="{ABU_ID}"' not in html:
              raise RuntimeError('Abu Al-Arousa YouTube ID was not applied to Selected Work')
          if f'data-youtube="{QOWA_ID}"' not in html:
              raise RuntimeError('Qowa Fi Alby YouTube ID was not applied to Selected Work')

          index_path.write_text(html, encoding='utf-8')
          print(f'Homepage patched: Abu changes={abu_changes}, Qowa changes={qowa_changes}')

          # ---- Category pages ----
          script_path = Path('script.js')
          text = script_path.read_text(encoding='utf-8')
          marker = 'const categoryData = '
          start = text.index(marker) + len(marker)
          function_start = text.index('function escapeHTML', start)
          raw = text[start:function_start].rstrip()
          if raw.endswith(';'):
              raw = raw[:-1].rstrip()
          data = json.loads(raw)

          # Series: same Abu Al-Arousa YouTube video used on homepage.
          series_projects = data['series']['projects']
          target = next((p for p in series_projects if p.get('index') == 'S02'), None)
          if target is None:
              raise RuntimeError('Series S02 project not found')
          target.clear()
          target.update({
              'title': 'Abu Al-Arousa — Haytan Beitna',
              'subtitle': 'Series Song · Video Editing',
              'index': 'S02',
              'image': f'https://i.ytimg.com/vi/{ABU_ID}/hqdefault.jpg',
              'imageFallback': 'assets/abu-el-arousa.webp',
              'youtube': ABU_ID,
              'badge': 'Watch Video',
          })

          # Institutional: restore original Qowa Fi Alby YouTube project.
          institutional_projects = data['institutional']['projects']
          qowa = next((p for p in institutional_projects if p.get('index') == 'SI01'), None)
          if qowa is None:
              raise RuntimeError('Institutional SI01 project not found')
          qowa.clear()
          qowa.update({
              'title': 'Hospital 57357 — Qowa Fi Alby',
              'subtitle': 'Music Video · Video Editing',
              'index': 'SI01',
              'image': f'https://i.ytimg.com/vi/{QOWA_ID}/hqdefault.jpg',
              'imageFallback': 'assets/hospital-57357.webp',
              'youtube': QOWA_ID,
              'badge': 'Watch Music Video',
          })
          data['institutional']['cover'] = f'https://i.ytimg.com/vi/{QOWA_ID}/hqdefault.jpg'

          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ';\n\n' + text[function_start:]
          script_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate English preview before deployment
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'data-youtube="hyYa8IUSJJc"' index.html
          grep -q 'data-youtube="2KVyASYThgw"' index.html
          grep -q 'https://i.ytimg.com/vi/hyYa8IUSJJc/hqdefault.jpg' index.html
          grep -q 'https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg' index.html
          grep -q '"youtube": "hyYa8IUSJJc"' script.js
          grep -q '"youtube": "2KVyASYThgw"' script.js
          if grep -q 'hospital-57357-qewa-fi-alby.mp4\|hospital-57357-qewa-fi-alby.webp' index.html script.js; then
            echo 'Broken Qowa local references are still present'
            exit 1
          fi
          if grep -q 'i18n-preview\|language-switcher' index.html; then
            echo 'Unexpected language code found in English preview'
            exit 1
          fi
          # Check both YouTube thumbnails exist before deploying.
          curl --fail --location --retry 3 --silent --show-error 'https://i.ytimg.com/vi/hyYa8IUSJJc/hqdefault.jpg' -o /tmp/abu.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg' -o /tmp/qowa.jpg
          test -s /tmp/abu.jpg
          test -s /tmp/qowa.jpg

      - name: Deploy English preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=language-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed preview
        shell: bash
        run: |
          set -euo pipefail
          preview='https://language-preview.sayedabdallah.pages.dev'
          for attempt in 1 2 3 4 5; do
            curl --fail --location --silent --show-error "${preview}/index.html" -o /tmp/preview-index.html || true
            curl --fail --location --silent --show-error "${preview}/script.js" -o /tmp/preview-script.js || true
            if grep -q 'data-youtube="hyYa8IUSJJc"' /tmp/preview-index.html 2>/dev/null \
              && grep -q 'data-youtube="2KVyASYThgw"' /tmp/preview-index.html 2>/dev/null \
              && grep -q '"youtube": "hyYa8IUSJJc"' /tmp/preview-script.js 2>/dev/null \
              && grep -q '"youtube": "2KVyASYThgw"' /tmp/preview-script.js 2>/dev/null; then
              echo 'Preview verified: Abu Al-Arousa and Qowa Fi Alby both use the correct YouTube videos.'
              exit 0
            fi
            sleep 3
          done
          echo 'Preview alias did not update with both YouTube videos in time.'
          exit 1