name: Deploy bilingual language preview

on:
  push:
    branches:
      - language-preview
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"
          curl --fail --location --retry 3 "${base}/index.html" --output index.html
          curl --fail --location --retry 3 "${base}/script.js" --output script.js
          curl --fail --location --retry 3 "${base}/styles.css" --output styles.css
          curl --fail --location --retry 3 "${base}/category-pages.css" --output category-pages.css || true
          curl --fail --location --retry 3 "${base}/favicon.svg" --output favicon.svg || true
          curl --fail --location --retry 3 "${base}/robots.txt" --output robots.txt || true

      - name: Download assets referenced by live site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.request
          import urllib.parse

          base = 'https://sayedabdallah.pages.dev/'
          source_files = ['index.html', 'script.js', 'styles.css', 'category-pages.css']
          refs = set()
          for filename in source_files:
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))

          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              url = urllib.parse.urljoin(base, ref)
              try:
                  print(f'Downloading {ref}')
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      target.write_bytes(response.read())
              except Exception as exc:
                  print(f'Warning: could not download {ref}: {exc}')
          PY

      - name: Inject bilingual preview layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          css_tag = '<link rel="stylesheet" href="i18n-preview.css">'
          js_tag = '<script src="i18n-preview.js"></script>'
          if css_tag not in html:
              html = html.replace('</head>', f'  {css_tag}\n</head>', 1)
          if js_tag not in html:
              html = html.replace('</body>', f'  {js_tag}\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          node --check script.js
          node --check i18n-preview.js

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=language-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
