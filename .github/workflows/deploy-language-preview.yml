name: Deploy English portfolio preview

on:
  push:
    branches:
      - language-preview
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Retrieve exact current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"
          curl --fail --location --retry 3 "${base}/index.html" --output index.html
          curl --fail --location --retry 3 "${base}/script.js" --output script.js
          curl --fail --location --retry 3 "${base}/styles.css" --output styles.css
          curl --fail --location --retry 3 "${base}/category-pages.css" --output category-pages.css
          curl --fail --location --retry 3 "${base}/favicon.svg" --output favicon.svg
          curl --fail --location --retry 3 "${base}/robots.txt" --output robots.txt

      - name: Download every local asset referenced by the live site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          base = 'https://sayedabdallah.pages.dev/'
          refs = set()
          for filename in ['index.html', 'script.js', 'styles.css', 'category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))
          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)
          print(f'Validated {len(refs)} downloaded assets.')
          PY

      - name: Apply only requested English preview fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil

          youtube_id = 'hyYa8IUSJJc'
          youtube_thumb = f'https://i.ytimg.com/vi/{youtube_id}/hqdefault.jpg'

          # Qowa Fi Alby: determine the REAL poster format instead of trusting the old .webp name.
          qowa_image_src = Path('assets/hospital-57357-qewa-fi-alby.webp')
          image_data = qowa_image_src.read_bytes()
          if image_data.startswith(b'\xff\xd8\xff'):
              image_ext = 'jpg'
          elif image_data.startswith(b'\x89PNG\r\n\x1a\n'):
              image_ext = 'png'
          elif image_data.startswith(b'RIFF') and b'WEBP' in image_data[:16]:
              image_ext = 'webp'
          else:
              raise RuntimeError('Unknown Qowa Fi Alby poster format: ' + image_data[:16].hex())

          qowa_image_path = f'assets/qowa-fi-alby-preview-v3.{image_ext}'
          qowa_video_path = 'assets/qowa-fi-alby-preview-v3.mp4'
          Path(qowa_image_path).write_bytes(image_data)
          shutil.copyfile('assets/hospital-57357-qewa-fi-alby.mp4', qowa_video_path)
          if b'ftyp' not in Path(qowa_video_path).read_bytes()[:64]:
              raise RuntimeError('Qowa Fi Alby source video is not a valid MP4')
          Path('qowa-image-path.txt').write_text(qowa_image_path, encoding='utf-8')

          # Selected Work: Abu Al-Arousa -> YouTube version of Haytan Beitna.
          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          abu_pattern = re.compile(r'<article class="project-card reveal project-video"\s*\n\s*data-category="TV"[\s\S]*?<span class="project-index">03</span>\s*</div>\s*</article>', re.M)
          abu = abu_pattern.search(html)
          if not abu:
              raise RuntimeError('Could not find Abu Al-Arousa Selected Work card')
          card = abu.group(0)
          card = re.sub(r'\s*data-video="[^"]*"', '', card, count=1)
          card = re.sub(r'\s*data-poster="[^"]*"', '', card, count=1)
          card = re.sub(r'data-title="[^"]*"', f'data-youtube="{youtube_id}"\n          data-title="Abu Al-Arousa — Haytan Beitna"', card, count=1)
          card = re.sub(r'aria-label="[^"]*"', 'aria-label="Play Abu Al-Arousa Haytan Beitna on YouTube"', card, count=1)
          card = re.sub(r'<img src="[^"]*" alt="[^"]*"', f'<img src="{youtube_thumb}" alt="Abu Al-Arousa Haytan Beitna song edited by Sayed Abdallah"', card, count=1)
          card = re.sub(r'<h3>[^<]*</h3><p>[^<]*</p>', '<h3>Abu Al-Arousa — Haytan Beitna</h3><p>Series Song · Video Editing</p>', card, count=1)
          html = html[:abu.start()] + card + html[abu.end():]

          # Selected Work: Qowa Fi Alby -> fresh correctly-typed poster + fresh video path.
          html = html.replace('assets/hospital-57357-qewa-fi-alby.mp4', qowa_video_path)
          html = html.replace('assets/hospital-57357-qewa-fi-alby.webp', qowa_image_path)
          html_path.write_text(html, encoding='utf-8')

          # Series page: use same YouTube video as Selected Work.
          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          series_old = re.compile(r"\{ title:'Abu Al-Arousa — Song', subtitle:'Series Song · Video Editing', index:'S02', image:'assets/abu-el-arousa\.webp', video:'assets/abu-el-arousa\.mp4', badge:'Watch Video' \}")
          series_new = "{ title:'Abu Al-Arousa — Haytan Beitna', subtitle:'Series Song · Video Editing', index:'S02', image:'%s', youtube:'%s', badge:'Watch Video' }" % (youtube_thumb, youtube_id)
          script, count = series_old.subn(series_new, script, count=1)
          if count != 1:
              raise RuntimeError('Could not update Abu Al-Arousa Series project')

          # Institutional page: Qowa Fi Alby fresh asset paths.
          script = script.replace('assets/hospital-57357-qewa-fi-alby.mp4', qowa_video_path)
          script = script.replace('assets/hospital-57357-qewa-fi-alby.webp', qowa_image_path)
          script_path.write_text(script, encoding='utf-8')
          print('Qowa poster detected as', image_ext)
          PY

      - name: Validate English preview before deployment
        shell: bash
        run: |
          set -euo pipefail
          qowa_image="$(cat qowa-image-path.txt)"
          node --check script.js
          grep -q 'data-youtube="hyYa8IUSJJc"' index.html
          grep -q 'qowa-fi-alby-preview-v3.mp4' index.html
          grep -q "$qowa_image" index.html
          grep -q "youtube:'hyYa8IUSJJc'" script.js
          test -s assets/qowa-fi-alby-preview-v3.mp4
          test -s "$qowa_image"
          if grep -q "i18n-preview\|language-switcher" index.html; then
            echo "Unexpected language code found in English preview"
            exit 1
          fi

      - name: Deploy English preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=language-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed preview files
        shell: bash
        run: |
          set -euo pipefail
          preview="https://language-preview.sayedabdallah.pages.dev"
          qowa_image="$(cat qowa-image-path.txt)"
          for attempt in 1 2 3 4 5; do
            if curl --fail --location --silent --show-error "${preview}/index.html" -o /tmp/preview-index.html; then break; fi
            sleep 3
          done
          grep -q 'data-youtube="hyYa8IUSJJc"' /tmp/preview-index.html
          grep -q 'qowa-fi-alby-preview-v3.mp4' /tmp/preview-index.html
          curl --fail --location --retry 5 --silent --show-error "${preview}/${qowa_image}" -o /tmp/qowa-poster
          curl --fail --location --retry 5 --silent --show-error --range 0-2047 "${preview}/assets/qowa-fi-alby-preview-v3.mp4" -o /tmp/qowa-video-part
          python - <<'PY'
          from pathlib import Path
          poster = Path('/tmp/qowa-poster').read_bytes()
          valid_image = poster.startswith(b'\xff\xd8\xff') or poster.startswith(b'\x89PNG\r\n\x1a\n') or (poster.startswith(b'RIFF') and b'WEBP' in poster[:16])
          if not valid_image:
              raise RuntimeError('Deployed Qowa poster failed image validation')
          if b'ftyp' not in Path('/tmp/qowa-video-part').read_bytes()[:64]:
              raise RuntimeError('Deployed Qowa video failed MP4 validation')
          print('Preview verified: Qowa Fi Alby assets OK; Abu Al-Arousa uses YouTube.')
          PY