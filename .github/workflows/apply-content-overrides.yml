name: Apply portfolio content overrides

on:
  workflow_run:
    workflows:
      - Deploy portfolio to Cloudflare Pages
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  apply-overrides:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve latest deployed portfolio
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deployments="$(curl --fail --silent --show-error --location \
            --request GET \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/sayedabdallah/deployments")"
          source_url="$(printf '%s' "${deployments}" | jq -r '.result[0].url')"
          test -n "${source_url}"
          test "${source_url}" != "null"
          echo "Using latest deployment: ${source_url}"

          curl --fail --location --retry 3 "${source_url}/index.html" --output index.html
          curl --fail --location --retry 3 "${source_url}/script.js" --output script.js

          mkdir -p assets
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 "${source_url}/assets/${file}" --output "assets/${file}"
          done

      - name: Optimize local MP4 files for seeking
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          shopt -s nullglob
          for file in assets/*.mp4; do
            echo "Optimizing ${file} for instant seeking"
            temp="${file%.mp4}.faststart.mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -i "${file}" \
              -c copy \
              -movflags +faststart \
              "${temp}"
            mv "${temp}" "${file}"
          done

      - name: Apply requested content and player updates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.parse
          import urllib.request

          def yt_title(video_id, fallback):
              try:
                  watch = f"https://www.youtube.com/watch?v={video_id}"
                  url = "https://www.youtube.com/oembed?" + urllib.parse.urlencode({"url": watch, "format": "json"})
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = json.load(response)
                  title = str(data.get("title", "")).strip()
                  return title or fallback
              except Exception:
                  return fallback

          path = Path("script.js")
          text = path.read_text(encoding="utf-8")
          marker = "const categoryData = "
          start = text.index(marker) + len(marker)
          function_start = text.index("function escapeHTML", start)
          raw_json = text[start:function_start].rstrip()
          if raw_json.endswith(";"):
              raw_json = raw_json[:-1].rstrip()
          data = json.loads(raw_json)

          # Correct Abu Al-Arousa / Haytan Beitna inside the Series category.
          haytan_id = "hyYa8IUSJJc"
          data["series"]["projects"][1] = {
              "title": yt_title(haytan_id, "Abu Al-Arousa — Haytan Beitna"),
              "subtitle": "Series Song · Video Editing",
              "index": "S02",
              "image": f"https://i.ytimg.com/vi/{haytan_id}/hqdefault.jpg",
              "imageFallback": "assets/abu-el-arousa.webp",
              "youtube": haytan_id,
              "badge": "Watch Video",
          }

          # Keep the Quran program title in Franco/English on every deployment.
          program_name = "Bel Quran Ehtadayt"
          for project in data["tv-programs"]["projects"]:
              if project.get("collection") == "bil-quran-ihtadayt":
                  project["title"] = program_name

          collection = data["tv-programs"]["collections"]["bil-quran-ihtadayt"]
          collection["title"] = program_name
          collection["description"] = f"Selected episodes and edits from the television program {program_name}."
          for project in collection["projects"]:
              project["subtitle"] = f"{program_name} · TV Program Edit"

          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ";\n\n" + text[function_start:]

          # Keep native controls, allow seeking, and hide download-related UI where browsers support it.
          player_marker = "const videoPlayer = document.getElementById('project-video-player');"
          player_setup = """const videoPlayer = document.getElementById('project-video-player');
if (videoPlayer) {
  videoPlayer.controls = true;
  videoPlayer.preload = 'auto';
  videoPlayer.setAttribute('controlsList', 'nodownload noremoteplayback');
  videoPlayer.disablePictureInPicture = true;
  videoPlayer.addEventListener('contextmenu', event => event.preventDefault());
}"""
          if player_marker in text and "controlsList', 'nodownload noremoteplayback'" not in text:
              text = text.replace(player_marker, player_setup, 1)

          local_branch = """  } else if (card.dataset.video && videoPlayer) {
    videoPlayer.src = card.dataset.video;
    videoPlayer.poster = card.dataset.poster || '';
    videoPlayer.hidden = false;
  }"""
          local_branch_fixed = """  } else if (card.dataset.video && videoPlayer) {
    videoPlayer.src = card.dataset.video;
    videoPlayer.poster = card.dataset.poster || '';
    videoPlayer.preload = 'auto';
    videoPlayer.hidden = false;
    videoPlayer.load();
  }"""
          if local_branch in text:
              text = text.replace(local_branch, local_branch_fixed, 1)

          path.write_text(text, encoding="utf-8")

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old_tag = '<video id="project-video-player" controls playsinline preload="metadata"></video>'
          new_tag = '<video id="project-video-player" controls playsinline preload="auto" controlslist="nodownload noremoteplayback" disablepictureinpicture oncontextmenu="return false;"></video>'
          if old_tag in html:
              html = html.replace(old_tag, new_tag, 1)
          index.write_text(html, encoding="utf-8")
          PY

          node --check script.js

      - name: Deploy corrected portfolio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
