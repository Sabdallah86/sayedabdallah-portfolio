name: Sync Selected Clients

on:
  workflow_run:
    workflows:
      - Deploy fixed portfolio to Cloudflare Pages
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  sync-clients:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"

          for file in index.html script.js styles.css category-pages.css robots.txt favicon.svg; do
            curl --fail --location --retry 3 "${base}/${file}" --output "${file}"
          done

          mkdir -p assets
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 "${base}/assets/${file}" --output "assets/${file}"
          done

      - name: Apply complete selected clients list
        run: python scripts/update_selected_clients.py

      - name: Apply fixed ON E project titles
        run: python scripts/rename_on_e_titles.py

      - name: Remove Ramadan 2025 completely
        run: python scripts/remove_ramadan_2025.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
