name: Pin My Guest English titles

on:
  issues:
    types: [opened]

permissions:
  contents: read
  deployments: write

jobs:
  pin:
    if: contains(github.event.issue.title, 'PIN-MY-GUEST-ENGLISH')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply persistent English title pin
        run: python pin_my_guest_english.py

      - name: Validate generated site
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'MY_GUEST_ENGLISH_LOCK_START' index.html
          grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' script.js
          grep -q 'Magdy Abdelghany — My Guest with Moataz El Demerdash' script.js
          grep -q 'Hany Ramzy — My Guest with Moataz El Demerdash' script.js
          grep -q 'Salah Abdallah — My Guest with Moataz El Demerdash' script.js
          grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' script.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          live='https://sayedabdallah.pages.dev'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "${live}/index.html" -o /tmp/index.html || true
            curl --fail --location --silent --show-error "${live}/script.js" -o /tmp/script.js || true
            if grep -q 'MY_GUEST_ENGLISH_LOCK_START' /tmp/index.html 2>/dev/null \
              && grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' /tmp/script.js 2>/dev/null \
              && grep -q 'Magdy Abdelghany — My Guest with Moataz El Demerdash' /tmp/script.js 2>/dev/null \
              && grep -q 'Hany Ramzy — My Guest with Moataz El Demerdash' /tmp/script.js 2>/dev/null \
              && grep -q 'Salah Abdallah — My Guest with Moataz El Demerdash' /tmp/script.js 2>/dev/null \
              && grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' /tmp/script.js 2>/dev/null; then
              echo 'FINAL CHECK PASSED: My Guest titles are pinned in English.'
              exit 0
            fi
            sleep 4
          done
          exit 1
