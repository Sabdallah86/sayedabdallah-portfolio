name: Pin My Guest English titles

on:
  issues:
    types: [opened]

permissions:
  contents: read
  deployments: write

jobs:
  pin:
    if: contains(github.event.issue.title, 'PIN-MY-GUEST-ENGLISH')
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve complete current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base='https://sayedabdallah.pages.dev/'
          curl --fail --location --retry 3 "${base}index.html" -o index.html
          curl --fail --location --retry 3 "${base}script.js" -o script.js
          curl --fail --location --retry 3 "${base}styles.css" -o styles.css
          curl --fail --location --retry 3 "${base}category-pages.css" -o category-pages.css
          curl --fail --location --retry 3 "${base}favicon.svg" -o favicon.svg
          curl --fail --location --retry 3 "${base}robots.txt" -o robots.txt

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          base = 'https://sayedabdallah.pages.dev/'
          refs = set()
          for filename in ['index.html','script.js','styles.css','category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))
          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = response.read()
                  if data:
                      target.write_bytes(data)
              except Exception as exc:
                  print(f'Skipping unavailable asset {ref}: {exc}')
          PY

      - name: Pin English titles in data and UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          titles = {
              '_5EHAht5a1M': 'Nader Abbassy — My Guest with Moataz El Demerdash',
              '_Sd8QUoXoaI': 'Magdy Abdelghany — My Guest with Moataz El Demerdash',
              '_7irVnrKMmM': 'Hany Ramzy — My Guest with Moataz El Demerdash',
              '_vUQ8quTX-w': 'Salah Abdallah — My Guest with Moataz El Demerdash',
              'FwVPJqsdXBc': 'Amr Mostafa — My Guest with Moataz El Demerdash',
          }

          # First layer: write the English names into categoryData itself.
          script_path = Path('script.js')
          text = script_path.read_text(encoding='utf-8')
          marker = 'const categoryData = '
          start = text.index(marker) + len(marker)
          function_start = text.index('function escapeHTML', start)
          raw = text[start:function_start].rstrip()
          if raw.endswith(';'):
              raw = raw[:-1].rstrip()
          data = json.loads(raw)
          collection = data.get('tv-programs', {}).get('collections', {}).get('my-guest-moataz-el-demerdash')
          if not collection:
              raise RuntimeError('My Guest collection not found')
          found = set()
          for project in collection.get('projects', []):
              video_id = project.get('youtube')
              if video_id in titles:
                  project['title'] = titles[video_id]
                  project['subtitle'] = 'TV Program Edit'
                  found.add(video_id)
          if found != set(titles):
              raise RuntimeError(f'Missing My Guest videos: {set(titles) - found}')
          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ';\n\n' + text[function_start:]
          script_path.write_text(text, encoding='utf-8')

          # Second layer: persistent runtime lock. It survives future deploys because
          # the main deployment workflow starts from the current live index.html.
          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = re.sub(r'\n?<!-- MY_GUEST_ENGLISH_LOCK_START -->[\s\S]*?<!-- MY_GUEST_ENGLISH_LOCK_END -->\n?', '\n', html)
          lock = r'''
<!-- MY_GUEST_ENGLISH_LOCK_START -->
<script id="my-guest-english-title-lock">
(() => {
  const titles = new Map([
    ['_5EHAht5a1M', 'Nader Abbassy — My Guest with Moataz El Demerdash'],
    ['_Sd8QUoXoaI', 'Magdy Abdelghany — My Guest with Moataz El Demerdash'],
    ['_7irVnrKMmM', 'Hany Ramzy — My Guest with Moataz El Demerdash'],
    ['_vUQ8quTX-w', 'Salah Abdallah — My Guest with Moataz El Demerdash'],
    ['FwVPJqsdXBc', 'Amr Mostafa — My Guest with Moataz El Demerdash']
  ]);
  let applying = false;
  const apply = () => {
    if (applying) return;
    applying = true;
    document.querySelectorAll('[data-youtube]').forEach(card => {
      const title = titles.get(card.dataset.youtube);
      if (!title) return;
      card.dataset.title = title;
      card.setAttribute('aria-label', `Play ${title}`);
      const heading = card.querySelector('.project-info h3, h3');
      if (heading && heading.textContent.trim() !== title) heading.textContent = title;
      const subtitle = card.querySelector('.project-info p, p');
      if (subtitle && subtitle.textContent.trim() !== 'TV Program Edit') subtitle.textContent = 'TV Program Edit';
      const image = card.querySelector('img');
      if (image) image.alt = title;
    });
    applying = false;
  };
  const start = () => {
    apply();
    new MutationObserver(apply).observe(document.body, { childList: true, subtree: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();
</script>
<!-- MY_GUEST_ENGLISH_LOCK_END -->
'''
          if '</body>' not in html:
              raise RuntimeError('Closing body tag not found')
          html = html.replace('</body>', lock + '\n</body>', 1)
          index_path.write_text(html, encoding='utf-8')
          PY

          node --check script.js
          grep -q 'MY_GUEST_ENGLISH_LOCK_START' index.html
          grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' script.js
          grep -q 'Magdy Abdelghany — My Guest with Moataz El Demerdash' script.js
          grep -q 'Hany Ramzy — My Guest with Moataz El Demerdash' script.js
          grep -q 'Salah Abdallah — My Guest with Moataz El Demerdash' script.js
          grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' script.js

      - name: Deploy pinned site to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final live site
        shell: bash
        run: |
          set -euo pipefail
          live='https://sayedabdallah.pages.dev'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "${live}/index.html" -o /tmp/live-index.html || true
            curl --fail --location --silent --show-error "${live}/script.js" -o /tmp/live-script.js || true
            if grep -q 'MY_GUEST_ENGLISH_LOCK_START' /tmp/live-index.html 2>/dev/null \
              && grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null \
              && grep -q 'Magdy Abdelghany — My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null \
              && grep -q 'Hany Ramzy — My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null \
              && grep -q 'Salah Abdallah — My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null \
              && grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null; then
              echo 'FINAL CHECK PASSED: My Guest titles are pinned in English.'
              exit 0
            fi
            sleep 4
          done
          echo 'Final live verification failed.'
          exit 1
