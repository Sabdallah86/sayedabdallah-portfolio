name: Qowa Selected Work fixer

on:
  issues:
    types: [opened]

permissions:
  contents: read
  deployments: write

jobs:
  fix-qowa:
    if: contains(github.event.issue.title, 'QOWA-FIX')
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve complete current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base='https://sayedabdallah.pages.dev/'
          curl --fail --location --retry 3 "${base}index.html" -o index.html
          curl --fail --location --retry 3 "${base}script.js" -o script.js
          curl --fail --location --retry 3 "${base}styles.css" -o styles.css
          curl --fail --location --retry 3 "${base}category-pages.css" -o category-pages.css
          curl --fail --location --retry 3 "${base}favicon.svg" -o favicon.svg
          curl --fail --location --retry 3 "${base}robots.txt" -o robots.txt

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          base = 'https://sayedabdallah.pages.dev/'
          refs = set()
          for filename in ['index.html','script.js','styles.css','category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))

          # The two broken Qowa local files are intentionally skipped; this fix
          # replaces them with the working YouTube source before deployment.
          refs.discard('assets/hospital-57357-qewa-fi-alby.webp')
          refs.discard('assets/hospital-57357-qewa-fi-alby.mp4')

          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)
          print(f'Downloaded {len(refs)} live assets.')
          PY

      - name: Fix Qowa Fi Alby in Selected Work only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          QOWA_ID = '2KVyASYThgw'
          thumb = f'https://i.ytimg.com/vi/{QOWA_ID}/hqdefault.jpg'
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'<article class="project-card reveal project-video"\s*\n\s*data-category="Institutional & Social Impact"[\s\S]*?<span class="project-index">06</span>\s*</div>\s*</article>',
              re.M,
          )
          match = pattern.search(html)
          if not match:
              raise RuntimeError('Could not find Qowa Fi Alby Selected Work card')

          card = match.group(0)
          card = re.sub(r'\s*data-video="[^"]*"', '', card, count=1)
          card = re.sub(r'\s*data-poster="[^"]*"', '', card, count=1)
          if 'data-youtube=' in card:
              card = re.sub(r'data-youtube="[^"]*"', f'data-youtube="{QOWA_ID}"', card, count=1)
          else:
              card = card.replace('data-title=', f'data-youtube="{QOWA_ID}"\n          data-title=', 1)
          card = re.sub(
              r'<img src="[^"]*" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"',
              f'<img src="{thumb}" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"',
              card,
              count=1,
          )

          html = html[:match.start()] + card + html[match.end():]
          path.write_text(html, encoding='utf-8')

          if f'data-youtube="{QOWA_ID}"' not in html:
              raise RuntimeError('Qowa YouTube ID missing after patch')
          if 'hospital-57357-qewa-fi-alby.mp4' in card or 'hospital-57357-qewa-fi-alby.webp' in card:
              raise RuntimeError('Broken local Qowa references remain in Selected Work card')
          if thumb not in card:
              raise RuntimeError('YouTube thumbnail missing from Selected Work card')
          print('Qowa Selected Work card patched successfully.')
          PY

          # Verify YouTube itself is available before touching production.
          curl --fail --silent --show-error \
            'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=2KVyASYThgw&format=json' \
            -o /tmp/qowa-oembed.json
          grep -q '"title":"Qowa Fi Alby"' /tmp/qowa-oembed.json
          curl --fail --location --silent --show-error \
            'https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg' \
            -o /tmp/qowa-thumb.jpg
          test -s /tmp/qowa-thumb.jpg
          node --check script.js

      - name: Deploy corrected portfolio to production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Qowa card on final live site
        shell: bash
        run: |
          set -euo pipefail
          live='https://sayedabdallah.pages.dev/index.html'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$live" -o /tmp/live-index.html || true
            if grep -q 'data-youtube="2KVyASYThgw"' /tmp/live-index.html 2>/dev/null \
              && grep -q 'https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg' /tmp/live-index.html 2>/dev/null \
              && ! grep -A18 -B5 'Hospital 57357 — Qowa Fi Alby' /tmp/live-index.html | grep -q 'hospital-57357-qewa-fi-alby.mp4'; then
              echo 'FINAL CHECK PASSED: Selected Work Qowa Fi Alby uses working YouTube video and thumbnail.'
              exit 0
            fi
            sleep 4
          done
          echo 'Final live verification failed.'
          exit 1
