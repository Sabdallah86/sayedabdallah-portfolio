name: Qowa source diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.issue.title, 'QOWA-DIAGNOSTIC')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Selected Work Qowa card
        shell: bash
        run: |
          set +e
          echo '=== LIVE INDEX QOWA REFERENCES ==='
          curl -sS -L 'https://sayedabdallah.pages.dev/index.html' -o /tmp/index.html
          grep -n -B 8 -A 16 -E 'Qowa Fi Alby|Hospital 57357|2KVyASYThgw|hospital-57357-qewa-fi-alby' /tmp/index.html || true
          echo
          echo '=== LIVE SCRIPT QOWA REFERENCES ==='
          curl -sS -L 'https://sayedabdallah.pages.dev/script.js' -o /tmp/script.js
          grep -n -B 5 -A 12 -E 'Qowa Fi Alby|2KVyASYThgw|hospital-57357-qewa-fi-alby' /tmp/script.js || true
          echo
          echo '=== CURRENT OEMBED ==='
          curl -sS -D /tmp/current.headers 'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=2KVyASYThgw&format=json' -o /tmp/current.body
          cat /tmp/current.headers
          cat /tmp/current.body
          echo
          echo '=== CURRENT THUMB ==='
          curl -sS -I 'https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg'
          exit 0
