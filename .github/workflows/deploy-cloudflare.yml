name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect YouTube metadata
        shell: bash
        run: |
          set -euo pipefail
          for id in sCGh1JRMK3E hO5xZWLdrTo sCjBAIkHqQw Me1dDAzhkVM; do
            echo "VIDEO_ID=${id}"
            curl --fail --silent --show-error --get \
              --data-urlencode "url=https://www.youtube.com/watch?v=${id}" \
              --data-urlencode "format=json" \
              https://www.youtube.com/oembed
            echo
          done

      - name: Retrieve existing portfolio media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://sayedabdallah.pages.dev/assets"
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            hospital-57357-qewa-fi-alby.webp
            hospital-57357-qewa-fi-alby.mp4
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "assets/${file}"
          done

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
