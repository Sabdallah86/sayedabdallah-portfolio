name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve existing portfolio media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://sayedabdallah.pages.dev/assets"
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "assets/${file}"
          done

      - name: Build portfolio sections and YouTube projects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.parse
          import urllib.request

          def yt_title(video_id, fallback):
              try:
                  watch = f"https://www.youtube.com/watch?v={video_id}"
                  url = "https://www.youtube.com/oembed?" + urllib.parse.urlencode({"url": watch, "format": "json"})
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = json.load(response)
                  title = str(data.get("title", "")).strip()
                  return title or fallback
              except Exception:
                  return fallback

          def thumb(video_id):
              return f"https://i.ytimg.com/vi/{video_id}/hqdefault.jpg"

          def youtube_project(video_id, fallback_title, subtitle, index, badge="Watch Video"):
              return {
                  "title": yt_title(video_id, fallback_title),
                  "subtitle": subtitle,
                  "index": index,
                  "image": thumb(video_id),
                  "imageFallback": "assets/on-e.webp",
                  "youtube": video_id,
                  "badge": badge,
              }

          category_data = {
              "commercial": {
                  "title": "Commercial & Branded Content",
                  "kicker": "Advertising",
                  "description": "Commercials, campaigns and promotional content edited for brands and organizations.",
                  "cover": "assets/toto-link-commercial.webp",
                  "projects": [
                      {"title":"ToTo Link","subtitle":"Commercial · Video Editing","index":"AD01","image":"assets/toto-link-commercial.webp","video":"assets/toto-link-commercial.mp4","badge":"Watch Ad"},
                      {"title":"SATUC","subtitle":"Branded Promo · Video Editing","index":"AD02","image":"assets/satuc-branded-promo.webp","video":"assets/satuc-branded-promo.mp4","badge":"Watch Promo"},
                  ],
              },
              "tv-programs": {
                  "title": "TV Programs",
                  "kicker": "Television",
                  "description": "Programs, formats, channel content and television promos.",
                  "cover": "assets/on-e.webp",
                  "projects": [
                      {"title":"ON E Channel","subtitle":"TV Programs · Video Collection","index":"TV01","image":thumb("8SzWYjluCpw"),"imageFallback":"assets/on-e.webp","collection":"on-e","badge":"Open Collection"},
                      {"title":"Ramadan 2025","subtitle":"TV Promo · Video Editing","index":"TV02","image":"assets/ramadan-2025.webp"},
                      {"title":"On the Road","subtitle":"TV Program · Video Collection","index":"TV03","image":thumb("fiNaW_oMzCo"),"imageFallback":"assets/on-e.webp","collection":"on-the-road","badge":"Open Collection"},
                      {"title":"ArabWood","subtitle":"Entertainment Program · Video Collection","index":"TV04","image":thumb("sCGh1JRMK3E"),"imageFallback":"assets/on-e.webp","collection":"arabwood","badge":"Open Collection"},
                      {"title":"بالقرآن اهتديت","subtitle":"TV Program · Video Collection","index":"TV05","image":thumb("VPg1fotF0wI"),"imageFallback":"assets/on-e.webp","collection":"bil-quran-ihtadayt","badge":"Open Collection"},
                      {"title":"Faseero","subtitle":"TV Program · Video Collection","index":"TV06","image":thumb("qUToplfiB2s"),"imageFallback":"assets/on-e.webp","collection":"faseero","badge":"Open Collection"},
                  ],
                  "collections": {
                      "on-e": {
                          "title": "ON E Channel",
                          "kicker": "TV Program",
                          "description": "Selected ON E television editing work.",
                          "cover": thumb("8SzWYjluCpw"),
                          "projects": [youtube_project("8SzWYjluCpw", "ON E — Video 01", "ON E · TV Program Edit", "ON01")],
                      },
                      "on-the-road": {
                          "title": "On the Road",
                          "kicker": "TV Program",
                          "description": "Selected On the Road shorts and social edits.",
                          "cover": thumb("fiNaW_oMzCo"),
                          "projects": [
                              youtube_project("fiNaW_oMzCo", "On the Road — Short 01", "On the Road · Short Edit", "OTR01"),
                              youtube_project("_irKRUCkujM", "On the Road — Short 02", "On the Road · Short Edit", "OTR02"),
                              youtube_project("YA6XVuavmx4", "On the Road — Short 03", "On the Road · Short Edit", "OTR03"),
                              youtube_project("UkZ7oWR22zk", "On the Road — Short 04", "On the Road · Short Edit", "OTR04"),
                          ],
                      },
                      "arabwood": {
                          "title": "ArabWood",
                          "kicker": "Entertainment Program",
                          "description": "Selected entertainment edits and event coverage created for ArabWood.",
                          "cover": thumb("sCGh1JRMK3E"),
                          "projects": [
                              {"title":"Promo General","subtitle":"ArabWood · Program Promo","index":"AW01","image":thumb("sCGh1JRMK3E"),"imageFallback":"assets/on-e.webp","youtube":"sCGh1JRMK3E","badge":"Watch Video"},
                              {"title":"Giorgio Armani","subtitle":"ArabWood · Entertainment Edit","index":"AW02","image":thumb("hO5xZWLdrTo"),"imageFallback":"assets/on-e.webp","youtube":"hO5xZWLdrTo","badge":"Watch Video"},
                              {"title":"Emmy Awards 2025","subtitle":"ArabWood · Event Edit","index":"AW03","image":thumb("sCjBAIkHqQw"),"imageFallback":"assets/on-e.webp","youtube":"sCjBAIkHqQw","badge":"Watch Video"},
                              {"title":"Brand Personality","subtitle":"ArabWood · Brand Edit","index":"AW04","image":thumb("Me1dDAzhkVM"),"imageFallback":"assets/on-e.webp","youtube":"Me1dDAzhkVM","badge":"Watch Video"},
                              {"title":"Salma Hayek","subtitle":"ArabWood · Entertainment Edit","index":"AW05","image":thumb("18Ghd_t5W2E"),"imageFallback":"assets/on-e.webp","youtube":"18Ghd_t5W2E","badge":"Watch Video"},
                              youtube_project("6-UYL8iSvr4", "ArabWood — Short 06", "ArabWood · Short Edit", "AW06"),
                              youtube_project("BYcajbe-aUU", "ArabWood — Short 07", "ArabWood · Short Edit", "AW07"),
                              youtube_project("V6ujs3xAFh4", "ArabWood — Short 08", "ArabWood · Short Edit", "AW08"),
                          ],
                      },
                      "bil-quran-ihtadayt": {
                          "title": "بالقرآن اهتديت",
                          "kicker": "TV Program",
                          "description": "Selected episodes and edits from the television program بالقرآن اهتديت.",
                          "cover": thumb("VPg1fotF0wI"),
                          "projects": [
                              youtube_project("VPg1fotF0wI", "بالقرآن اهتديت — 01", "بالقرآن اهتديت · TV Program Edit", "BQ01"),
                              youtube_project("LIxN5p9Ymp8", "بالقرآن اهتديت — 02", "بالقرآن اهتديت · TV Program Edit", "BQ02"),
                              youtube_project("n9-uUhq2jjg", "بالقرآن اهتديت — 03", "بالقرآن اهتديت · TV Program Edit", "BQ03"),
                              youtube_project("dIw9LM6kOaE", "بالقرآن اهتديت — 04", "بالقرآن اهتديت · TV Program Edit", "BQ04"),
                              youtube_project("M8QicqBdPhs", "بالقرآن اهتديت — 05", "بالقرآن اهتديت · TV Program Edit", "BQ05"),
                          ],
                      },
                      "faseero": {
                          "title": "Faseero",
                          "kicker": "TV Program",
                          "description": "Selected work from Faseero.",
                          "cover": thumb("qUToplfiB2s"),
                          "projects": [youtube_project("qUToplfiB2s", "Faseero — Video 01", "Faseero · TV Program Edit", "FS01")],
                      },
                  },
              },
              "series": {
                  "title": "Series",
                  "kicker": "TV & Entertainment",
                  "description": "Promos, songs and selected edits created for television series.",
                  "cover": "assets/teatro-series-promo.webp",
                  "projects": [
                      {"title":"Promo — Teatro","subtitle":"Series Promo · Video Editing","index":"S01","image":"assets/teatro-series-promo.webp","video":"assets/teatro-series-promo.mp4","badge":"Watch Promo"},
                      {"title":"Abu Al-Arousa — Song","subtitle":"Series Song · Video Editing","index":"S02","image":"assets/abu-el-arousa.webp","video":"assets/abu-el-arousa.mp4","badge":"Watch Video"},
                  ],
              },
              "video-clips": {
                  "title": "Video Clips",
                  "kicker": "Music Videos",
                  "description": "Selected music videos and performance-led edits.",
                  "cover": thumb("eVf2BU9Tux4"),
                  "projects": [
                      youtube_project("eVf2BU9Tux4", "Video Clip — 01", "Music Video · Video Editing", "VC01", "Watch Video Clip"),
                      youtube_project("yWmc4v00bFs", "Video Clip — 02", "Music Video · Video Editing", "VC02", "Watch Video Clip"),
                  ],
              },
              "sports-events": {
                  "title": "Sports & Events",
                  "kicker": "Live Energy",
                  "description": "Sports content, festival coverage and event-driven storytelling.",
                  "cover": "assets/al-ahly.webp",
                  "projects": [
                      {"title":"Al Ahly Club","subtitle":"Sports Content · Video Editing","index":"SE01","image":"assets/al-ahly.webp"},
                      {"title":"Cairo International Film Festival","subtitle":"Event Coverage · Video Editing","index":"SE02","image":"assets/ciff.webp"},
                  ],
              },
              "institutional": {
                  "title": "Institutional & Social Impact",
                  "kicker": "Purpose-Driven Stories",
                  "description": "Human-centered films and campaigns created for institutions and social-impact organizations.",
                  "cover": thumb("2KVyASYThgw"),
                  "projects": [
                      {"title":"Hospital 57357 — Qowa Fi Alby","subtitle":"Music Video · Video Editing","index":"SI01","image":thumb("2KVyASYThgw"),"imageFallback":"assets/hospital-57357.webp","youtube":"2KVyASYThgw","badge":"Watch Music Video"},
                      youtube_project("SIndjl5ZIL0", "Institutional Music Video — 02", "Music Video · Video Editing", "SI02", "Watch Music Video"),
                  ],
              },
              "motion-graphics": {
                  "title": "Motion Graphics & 3D",
                  "kicker": "Design in Motion",
                  "description": "Titles, graphic packages, animation and visual systems created for screen.",
                  "cover": "assets/showreel.webp",
                  "projects": [],
              },
          }

          script = Path("script.js")
          text = script.read_text(encoding="utf-8")
          start = text.index("const categoryData = {")
          end = text.index("\n\nfunction escapeHTML", start)
          replacement = "const categoryData = " + json.dumps(category_data, ensure_ascii=False, indent=2) + ";\n"
          text = text[:start] + replacement + text[end:]

          marker = "`;document.head.appendChild(arabwoodStyles);"
          extra_css = """
          .category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
          .collection-page .portfolio-page-hero{min-height:470px;padding-top:130px;padding-bottom:58px}
          .collection-page .page-hero-content h1{font-size:clamp(66px,9vw,130px)}
          @media(max-width:1100px){.category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media(max-width:760px){.category-grid{grid-template-columns:1fr 1fr}.collection-page .portfolio-page-hero{min-height:400px}}
          @media(max-width:470px){.category-grid{grid-template-columns:1fr}}
          """
          if marker in text:
              text = text.replace(marker, extra_css + marker, 1)

          script.write_text(text, encoding="utf-8")

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")

          html = html.replace('data-video="assets/hospital-57357-qewa-fi-alby.mp4"', 'data-youtube="2KVyASYThgw"')
          html = html.replace('data-poster="assets/hospital-57357-qewa-fi-alby.webp"\n          ', '')
          html = html.replace('src="assets/hospital-57357-qewa-fi-alby.webp" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"', 'src="https://i.ytimg.com/vi/2KVyASYThgw/hqdefault.jpg" alt="Hospital 57357 Qowa Fi Alby music video edited by Sayed Abdallah"')

          if 'href="index.html?category=video-clips"' not in html:
              series_card = '<a class="category-card reveal category-link" href="index.html?category=series"><span class="category-icon">▶</span><h3>Series</h3><p>Promos, songs and selected series edits.</p><span class="category-action">View Projects →</span></a>'
              video_card = series_card + '\n        <a class="category-card reveal category-link" href="index.html?category=video-clips"><span class="category-icon">♪</span><h3>Video<br>Clips</h3><p>Music videos and performance edits.</p><span class="category-action">View Projects →</span></a>'
              html = html.replace(series_card, video_card, 1)

          index.write_text(html, encoding="utf-8")
          PY

          node --check script.js

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
