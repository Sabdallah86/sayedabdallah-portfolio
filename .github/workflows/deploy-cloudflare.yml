name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve existing portfolio media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://sayedabdallah.pages.dev/assets"
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            hospital-57357-qewa-fi-alby.webp
            hospital-57357-qewa-fi-alby.mp4
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-delay 2 "${base}/${file}" --output "assets/${file}"
          done

      - name: Restore On the Road videos from deployment history
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          deployments="$(curl --fail --silent --show-error --location \
            --request GET \
            --header "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/sayedabdallah/deployments")"

          source_url=""
          while IFS= read -r deployment_url; do
            [ -z "${deployment_url}" ] && continue
            if curl --fail --silent --location \
              "${deployment_url}/assets/on-the-road-first-journey.mp4" \
              --output /dev/null; then
              source_url="${deployment_url}"
              break
            fi
          done < <(printf '%s' "${deployments}" | jq -r '.result[].url')

          if [ -z "${source_url}" ]; then
            echo "Unable to locate the previous On the Road media deployment." >&2
            exit 1
          fi

          echo "Restoring On the Road videos from ${source_url}"
          files=(
            on-the-road-first-journey.mp4
            on-the-road-nelly-karim.mp4
            on-the-road-life-road.mp4
            on-the-road-25-years.mp4
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-delay 2 \
              "${source_url}/assets/${file}" \
              --output "assets/${file}"
          done

      - name: Create clean On the Road thumbnails
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          videos=(
            on-the-road-first-journey
            on-the-road-nelly-karim
            on-the-road-life-road
            on-the-road-25-years
          )

          for video in "${videos[@]}"; do
            echo "Creating thumbnail for ${video}"
            ffmpeg -hide_banner -loglevel error -y \
              -ss 1 \
              -i "assets/${video}.mp4" \
              -frames:v 1 \
              -vf "scale=1200:1500:force_original_aspect_ratio=increase,crop=1200:1500" \
              -q:v 2 \
              "assets/${video}.jpg"
            test -s "assets/${video}.jpg"
          done

      - name: Restore On the Road collection in TV Programs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          start = text.index("  'tv-programs': {")
          end = text.index("  series: {", start)

          tv_programs = """  'tv-programs': {
            title:'TV Programs',
            kicker:'Television',
            description:'Programs, formats, channel content and television promos.',
            cover:'assets/on-e.webp',
            projects:[
              { title:'ON E Channel', subtitle:'TV Programs · Video Editing', index:'TV01', image:'assets/on-e.webp' },
              { title:'Ramadan 2025', subtitle:'TV Promo · Video Editing', index:'TV02', image:'assets/ramadan-2025.webp' },
              { title:'On the Road', subtitle:'TV Program · Video Collection', index:'TV03', image:'assets/on-the-road-first-journey.jpg', imageFallback:'assets/on-e.webp', collection:'on-the-road', badge:'Open Collection' },
              { title:'ArabWood', subtitle:'Entertainment Program · Video Collection', index:'TV04', image:'https://i.ytimg.com/vi/sCGh1JRMK3E/hqdefault.jpg', imageFallback:'assets/on-e.webp', collection:'arabwood', badge:'Open Collection' }
            ],
            collections:{
              'on-the-road':{
                title:'On the Road',
                kicker:'TV Program',
                description:'A dedicated collection of promos and social edits created for the On the Road program.',
                cover:'assets/on-the-road-first-journey.jpg',
                layout:'portrait',
                projects:[
                  { title:'First Journey', subtitle:'On the Road · Program Promo', index:'OTR01', image:'assets/on-the-road-first-journey.jpg', imageFallback:'assets/on-e.webp', video:'assets/on-the-road-first-journey.mp4', badge:'Watch Video', format:'portrait' },
                  { title:'Nelly Karim Teaser', subtitle:'On the Road · Social Promo', index:'OTR02', image:'assets/on-the-road-nelly-karim.jpg', imageFallback:'assets/on-e.webp', video:'assets/on-the-road-nelly-karim.mp4', badge:'Watch Video', format:'portrait' },
                  { title:'The Road of Life', subtitle:'On the Road · Program Teaser', index:'OTR03', image:'assets/on-the-road-life-road.jpg', imageFallback:'assets/on-e.webp', video:'assets/on-the-road-life-road.mp4', badge:'Watch Video', format:'portrait' },
                  { title:'Back After 25 Years', subtitle:'On the Road · Launch Promo', index:'OTR04', image:'assets/on-the-road-25-years.jpg', imageFallback:'assets/on-e.webp', video:'assets/on-the-road-25-years.mp4', badge:'Watch Video', format:'portrait' }
                ]
              },
              'arabwood':{
                title:'ArabWood',
                kicker:'Entertainment Program',
                description:'Selected entertainment edits and event coverage created for ArabWood.',
                cover:'https://i.ytimg.com/vi/sCGh1JRMK3E/hqdefault.jpg',
                projects:[
                  { title:'Promo General', subtitle:'ArabWood · Program Promo', index:'AW01', image:'https://i.ytimg.com/vi/sCGh1JRMK3E/hqdefault.jpg', imageFallback:'assets/on-e.webp', youtube:'sCGh1JRMK3E', badge:'Watch Video' },
                  { title:'Giorgio Armani', subtitle:'ArabWood · Entertainment Edit', index:'AW02', image:'https://i.ytimg.com/vi/hO5xZWLdrTo/hqdefault.jpg', imageFallback:'assets/on-e.webp', youtube:'hO5xZWLdrTo', badge:'Watch Video' },
                  { title:'Emmy Awards 2025', subtitle:'ArabWood · Event Edit', index:'AW03', image:'https://i.ytimg.com/vi/sCjBAIkHqQw/hqdefault.jpg', imageFallback:'assets/on-e.webp', youtube:'sCjBAIkHqQw', badge:'Watch Video' },
                  { title:'Brand Personality', subtitle:'ArabWood · Brand Edit', index:'AW04', image:'https://i.ytimg.com/vi/Me1dDAzhkVM/hqdefault.jpg', imageFallback:'assets/on-e.webp', youtube:'Me1dDAzhkVM', badge:'Watch Video' },
                  { title:'Salma Hayek', subtitle:'ArabWood · Entertainment Edit', index:'AW05', image:'https://i.ytimg.com/vi/18Ghd_t5W2E/hqdefault.jpg', imageFallback:'assets/on-e.webp', youtube:'18Ghd_t5W2E', badge:'Watch Video' }
                ]
              }
            }
          },
          """

          text = text[:start] + tv_programs + text[end:]

          marker = "`;document.head.appendChild(arabwoodStyles);"
          collection_css = """
          .collection-page .portfolio-page-hero{min-height:470px;padding-top:130px;padding-bottom:58px}
          .collection-page .page-hero-content h1{font-size:clamp(66px,9vw,130px)}
          .portrait-project-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
          .portrait-project .project-image{aspect-ratio:4/5;overflow:hidden}
          .portrait-project .project-image img{width:100%;height:100%;object-fit:cover}
          .portrait-project .project-info{align-items:flex-start}
          .portrait-project .project-info h3{font-size:17px}
          .video-modal video{object-fit:contain}
          .video-modal.portrait-video .video-modal-inner{width:min(520px,100%)}
          @media(max-width:760px){.collection-page .portfolio-page-hero{min-height:400px}.portrait-project-grid{grid-template-columns:1fr}.portrait-project .project-image{aspect-ratio:4/5}}
          """
          if marker in text:
              text = text.replace(marker, collection_css + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check script.js

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
