name: Update Selected Clients

on:
  workflow_run:
    workflows:
      - Deploy fixed portfolio to Cloudflare Pages
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  update-clients:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"

          for file in index.html script.js styles.css category-pages.css robots.txt favicon.svg; do
            curl --fail --location --retry 3 "${base}/${file}" --output "${file}"
          done

          mkdir -p assets
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 "${base}/assets/${file}" --output "assets/${file}"
          done

      - name: Replace selected clients list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          clients = [
              'AL-AHRAM AGENCY',
              '57357',
              '3DI - YASSER SAMI',
              'TERA SOFT',
              'MICA EGYPT',
              'AL TAHRIR CHANNEL',
              'TEN CHANNEL',
              'AL AHLY CLUB',
          ]
          spans = '\n'.join(f'        <span>{name}</span>' for name in clients)
          replacement = '<div class="client-strip reveal" aria-label="Selected clients">\n' + spans + '\n      </div>'

          pattern = r'<div class="client-strip reveal" aria-label="Selected clients">.*?</div>'
          html, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find selected clients block')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
