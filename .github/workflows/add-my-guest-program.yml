name: Add My Guest TV Program

on:
  issues:
    types: [opened]

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    if: contains(github.event.issue.title, 'ADD-MY-GUEST')
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base='https://sayedabdallah.pages.dev/'
          curl --fail --location --retry 3 "${base}index.html" -o index.html
          curl --fail --location --retry 3 "${base}script.js" -o script.js
          curl --fail --location --retry 3 "${base}styles.css" -o styles.css
          curl --fail --location --retry 3 "${base}category-pages.css" -o category-pages.css
          curl --fail --location --retry 3 "${base}favicon.svg" -o favicon.svg
          curl --fail --location --retry 3 "${base}robots.txt" -o robots.txt

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          base = 'https://sayedabdallah.pages.dev/'
          refs = set()
          for filename in ['index.html','script.js','styles.css','category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))
          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)
          print(f'Downloaded {len(refs)} assets.')
          PY

      - name: Validate YouTube videos and add collection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, urllib.parse, urllib.request

          VIDEO_IDS = [
              '_5EHAht5a1M',
              '_Sd8QUoXoaI',
              '_7irVnrKMmM',
              '_vUQ8quTX-w',
              'FwVPJqsdXBc',
          ]
          TITLE = 'My Guest with Moataz El Demerdash'
          SLUG = 'my-guest-moataz-el-demerdash'

          def fetch_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          def youtube_meta(video_id):
              watch = f'https://www.youtube.com/watch?v={video_id}'
              url = 'https://www.youtube.com/oembed?' + urllib.parse.urlencode({'url': watch, 'format': 'json'})
              data = fetch_json(url)
              title = str(data.get('title','')).strip()
              if not title:
                  raise RuntimeError(f'No YouTube title for {video_id}')
              return title

          titles = [youtube_meta(video_id) for video_id in VIDEO_IDS]
          print('Validated videos:')
          for video_id, title in zip(VIDEO_IDS, titles):
              print(video_id, '|', title)

          script_path = Path('script.js')
          text = script_path.read_text(encoding='utf-8')
          marker = 'const categoryData = '
          start = text.index(marker) + len(marker)
          function_start = text.index('function escapeHTML', start)
          raw = text[start:function_start].rstrip()
          if raw.endswith(';'):
              raw = raw[:-1].rstrip()
          data = json.loads(raw)

          tv = data['tv-programs']
          tv.setdefault('collections', {})
          tv['projects'] = [p for p in tv.get('projects', []) if p.get('collection') != SLUG]

          card = {
              'title': TITLE,
              'subtitle': 'TV Program · Video Collection',
              'index': 'TV09',
              'image': f'https://i.ytimg.com/vi/{VIDEO_IDS[0]}/hqdefault.jpg',
              'imageFallback': 'assets/on-e.webp',
              'collection': SLUG,
              'badge': 'Open Collection',
          }
          tv['projects'].append(card)

          projects = []
          for i, (video_id, video_title) in enumerate(zip(VIDEO_IDS, titles), 1):
              projects.append({
                  'title': video_title,
                  'subtitle': f'{TITLE} · TV Program Edit',
                  'index': f'MG{i:02d}',
                  'image': f'https://i.ytimg.com/vi/{video_id}/hqdefault.jpg',
                  'imageFallback': 'assets/on-e.webp',
                  'youtube': video_id,
                  'badge': 'Watch Video',
              })

          tv['collections'][SLUG] = {
              'title': TITLE,
              'kicker': 'TV Program',
              'description': f'Selected episodes and edits from {TITLE}.',
              'cover': f'https://i.ytimg.com/vi/{VIDEO_IDS[0]}/hqdefault.jpg',
              'projects': projects,
          }

          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ';\n\n' + text[function_start:]
          script_path.write_text(text, encoding='utf-8')

          if f'"collection": "{SLUG}"' not in text:
              raise RuntimeError('New TV Program card missing')
          for video_id in VIDEO_IDS:
              if f'"youtube": "{video_id}"' not in text:
                  raise RuntimeError(f'Missing YouTube video {video_id}')
          PY
          node --check script.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live program collection
        shell: bash
        run: |
          set -euo pipefail
          final='https://sayedabdallah.pages.dev/script.js'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "$final" -o /tmp/live-script.js || true
            if grep -q 'My Guest with Moataz El Demerdash' /tmp/live-script.js 2>/dev/null \
              && grep -q '"collection": "my-guest-moataz-el-demerdash"' /tmp/live-script.js 2>/dev/null \
              && grep -q '"youtube": "_5EHAht5a1M"' /tmp/live-script.js 2>/dev/null \
              && grep -q '"youtube": "_Sd8QUoXoaI"' /tmp/live-script.js 2>/dev/null \
              && grep -q '"youtube": "_7irVnrKMmM"' /tmp/live-script.js 2>/dev/null \
              && grep -q '"youtube": "_vUQ8quTX-w"' /tmp/live-script.js 2>/dev/null \
              && grep -q '"youtube": "FwVPJqsdXBc"' /tmp/live-script.js 2>/dev/null; then
              echo 'FINAL CHECK PASSED: My Guest collection is live with all five videos.'
              exit 0
            fi
            sleep 4
          done
          echo 'Live verification failed.'
          exit 1
