name: Rename Motion Graphics to AI WORK

on:
  workflow_run:
    workflows:
      - Deploy fixed portfolio to Cloudflare Pages
    types:
      - completed

permissions:
  contents: read
  deployments: write

jobs:
  rename-ai-work:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"

          for file in index.html script.js styles.css category-pages.css robots.txt favicon.svg; do
            curl --fail --location --retry 3 "${base}/${file}" --output "${file}"
          done

          mkdir -p assets
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            curl --fail --location --retry 3 "${base}/assets/${file}" --output "assets/${file}"
          done

      - name: Rename category to AI WORK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          script_path = Path("script.js")
          text = script_path.read_text(encoding="utf-8")
          marker = "const categoryData = "
          start = text.index(marker) + len(marker)
          function_start = text.index("function escapeHTML", start)
          raw_json = text[start:function_start].rstrip()
          if raw_json.endswith(";"):
              raw_json = raw_json[:-1].rstrip()
          data = json.loads(raw_json)

          ai = data.setdefault("motion-graphics", {})
          ai["title"] = "AI WORK"
          ai["kicker"] = "Artificial Intelligence"
          ai["description"] = "AI-generated visuals, creative experiments and intelligent visual storytelling."

          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ";\n\n" + text[function_start:]
          script_path.write_text(text, encoding="utf-8")

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          old_card = '<a class="category-card reveal category-link" href="index.html?category=motion-graphics"><span class="category-icon">◇</span><h3>Motion Graphics<br>&amp; 3D</h3><p>Titles, graphics and visual systems.</p><span class="category-action">View Projects →</span></a>'
          new_card = '<a class="category-card reveal category-link" href="index.html?category=motion-graphics"><span class="category-icon">◇</span><h3>AI WORK</h3><p>AI-generated visuals and creative experiments.</p><span class="category-action">View Projects →</span></a>'
          html = html.replace(old_card, new_card, 1)
          index_path.write_text(html, encoding="utf-8")
          PY

          node --check script.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
