name: Publish My Guest title override

on:
  issues:
    types: [opened]

permissions:
  contents: read
  deployments: write

jobs:
  publish:
    if: contains(github.event.issue.title, 'PUBLISH-MY-GUEST-TITLES')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base='https://sayedabdallah.pages.dev/'
          curl --fail --location --retry 3 "${base}index.html" -o index.html
          curl --fail --location --retry 3 "${base}script.js" -o script.js
          curl --fail --location --retry 3 "${base}styles.css" -o styles.css
          curl --fail --location --retry 3 "${base}category-pages.css" -o category-pages.css
          curl --fail --location --retry 3 "${base}favicon.svg" -o favicon.svg
          curl --fail --location --retry 3 "${base}robots.txt" -o robots.txt

          python - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          base = 'https://sayedabdallah.pages.dev/'
          refs = set()
          for filename in ['index.html','script.js','styles.css','category-pages.css']:
              text = Path(filename).read_text(encoding='utf-8', errors='ignore')
              refs.update(re.findall(r'assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)', text, flags=re.I))
          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              if not data:
                  raise RuntimeError(f'Empty asset: {ref}')
              target.write_bytes(data)
          print(f'Downloaded {len(refs)} live assets.')
          PY

      - name: Add persistent title override to live page
        shell: bash
        run: |
          set -euo pipefail
          test -s my-guest-titles.js
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="my-guest-titles.js" defer></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise RuntimeError('Could not find </body> in live index')
              html = html.replace('</body>', f'  {tag}\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'my-guest-titles.js' index.html
          grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' my-guest-titles.js
          grep -q 'Magdy Abdelghany — My Guest with Moataz El Demerdash' my-guest-titles.js
          grep -q 'Hany Ramzy — My Guest with Moataz El Demerdash' my-guest-titles.js
          grep -q 'Salah Abdallah — My Guest with Moataz El Demerdash' my-guest-titles.js
          grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' my-guest-titles.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final live site
        shell: bash
        run: |
          set -euo pipefail
          final='https://sayedabdallah.pages.dev'
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --silent --show-error "${final}/index.html" -o /tmp/index.html || true
            curl --fail --location --silent --show-error "${final}/my-guest-titles.js" -o /tmp/titles.js || true
            if grep -q 'my-guest-titles.js' /tmp/index.html 2>/dev/null \
              && grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' /tmp/titles.js 2>/dev/null \
              && grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' /tmp/titles.js 2>/dev/null; then
              echo 'My Guest English titles are live.'
              exit 0
            fi
            sleep 4
          done
          echo 'Live verification failed.'
          exit 1
