name: Deploy fixed portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve current live portfolio
        shell: bash
        run: |
          set -euo pipefail
          base="https://sayedabdallah.pages.dev"

          curl --fail --location --retry 3 "${base}/index.html" --output index.html
          curl --fail --location --retry 3 "${base}/script.js" --output script.js

          mkdir -p assets
          files=(
            hero.webp
            al-ahly.webp
            ciff.webp
            abu-el-arousa.webp
            abu-el-arousa.mp4
            on-e.webp
            ramadan-2025.webp
            hospital-57357.webp
            showreel.webp
            og-image.webp
            sayed-abdallah.webp
            toto-link-commercial.webp
            toto-link-commercial.mp4
            satuc-branded-promo.webp
            satuc-branded-promo.mp4
            teatro-series-promo.webp
            teatro-series-promo.mp4
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-delay 2 "${base}/assets/${file}" --output "assets/${file}"
          done

      - name: Optimize local MP4 files for seeking
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          shopt -s nullglob
          for file in assets/*.mp4; do
            echo "Optimizing ${file}"
            temp="${file%.mp4}.faststart.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "${file}" -c copy -movflags +faststart "${temp}"
            mv "${temp}" "${file}"
          done

      - name: Apply portfolio and video-player fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import urllib.parse
          import urllib.request

          def yt_title(video_id, fallback):
              try:
                  watch = f"https://www.youtube.com/watch?v={video_id}"
                  url = "https://www.youtube.com/oembed?" + urllib.parse.urlencode({"url": watch, "format": "json"})
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=12) as response:
                      data = json.load(response)
                  title = str(data.get("title", "")).strip()
                  return title or fallback
              except Exception:
                  return fallback

          script_path = Path("script.js")
          text = script_path.read_text(encoding="utf-8")
          marker = "const categoryData = "
          start = text.index(marker) + len(marker)
          function_start = text.index("function escapeHTML", start)
          raw_json = text[start:function_start].rstrip()
          if raw_json.endswith(";"):
              raw_json = raw_json[:-1].rstrip()
          data = json.loads(raw_json)

          haytan_id = "hyYa8IUSJJc"
          data["series"]["projects"][1] = {
              "title": yt_title(haytan_id, "Abu Al-Arousa — Haytan Beitna"),
              "subtitle": "Series Song · Video Editing",
              "index": "S02",
              "image": f"https://i.ytimg.com/vi/{haytan_id}/hqdefault.jpg",
              "imageFallback": "assets/abu-el-arousa.webp",
              "youtube": haytan_id,
              "badge": "Watch Video",
          }

          institutional_id = "SIndjl5ZIL0"
          if len(data.get("institutional", {}).get("projects", [])) > 1:
              data["institutional"]["projects"][1] = {
                  "title": yt_title(institutional_id, "Institutional Music Video — 02"),
                  "subtitle": "Music Video · Video Editing",
                  "index": "SI02",
                  "image": f"https://i.ytimg.com/vi/{institutional_id}/hqdefault.jpg",
                  "imageFallback": "assets/hospital-57357.webp",
                  "youtube": institutional_id,
                  "badge": "Watch Music Video",
              }

          program_name = "Bel Quran Ehtadayt"
          for project in data["tv-programs"]["projects"]:
              if project.get("collection") == "bil-quran-ihtadayt":
                  project["title"] = program_name
          collection = data["tv-programs"]["collections"]["bil-quran-ihtadayt"]
          collection["title"] = program_name
          collection["description"] = f"Selected episodes and edits from the television program {program_name}."
          for project in collection["projects"]:
              project["subtitle"] = f"{program_name} · TV Program Edit"

          makhmak_id = "mkJ6DVwDMjQ"
          makhmak_title = "Program MAKHMAK — Platform SHASHA Kuwait"
          tv_programs = data["tv-programs"]
          tv_programs["projects"] = [
              project for project in tv_programs["projects"]
              if project.get("collection") != "makhmak"
          ]
          tv_programs["projects"].append({
              "title": makhmak_title,
              "subtitle": "TV Program · SHASHA Kuwait",
              "index": "TV07",
              "image": f"https://i.ytimg.com/vi/{makhmak_id}/hqdefault.jpg",
              "imageFallback": "assets/on-e.webp",
              "collection": "makhmak",
              "badge": "Open Collection",
          })
          tv_programs.setdefault("collections", {})["makhmak"] = {
              "title": makhmak_title,
              "kicker": "TV Program",
              "description": "Selected work from MAKHMAK on SHASHA Kuwait.",
              "cover": f"https://i.ytimg.com/vi/{makhmak_id}/hqdefault.jpg",
              "projects": [{
                  "title": yt_title(makhmak_id, "MAKHMAK — SHASHA Kuwait"),
                  "subtitle": "MAKHMAK · SHASHA Kuwait · Video Editing",
                  "index": "MK01",
                  "image": f"https://i.ytimg.com/vi/{makhmak_id}/hqdefault.jpg",
                  "imageFallback": "assets/on-e.webp",
                  "youtube": makhmak_id,
                  "badge": "Watch Video",
              }],
          }

          updated = json.dumps(data, ensure_ascii=False, indent=2)
          text = text[:start] + updated + ";\n\n" + text[function_start:]

          player_marker = "const videoPlayer = document.getElementById('project-video-player');"
          player_setup = "const videoPlayer = document.getElementById('project-video-player');\nif (videoPlayer) {\n  videoPlayer.controls = true;\n  videoPlayer.preload = 'auto';\n  videoPlayer.setAttribute('controlsList', 'nodownload noremoteplayback');\n  videoPlayer.disablePictureInPicture = true;\n  videoPlayer.addEventListener('contextmenu', event => event.preventDefault());\n}"
          if player_marker in text and "controlsList', 'nodownload noremoteplayback'" not in text:
              text = text.replace(player_marker, player_setup, 1)

          old_local = "  } else if (card.dataset.video && videoPlayer) {\n    videoPlayer.src = card.dataset.video;\n    videoPlayer.poster = card.dataset.poster || '';\n    videoPlayer.hidden = false;\n  }"
          new_local = "  } else if (card.dataset.video && videoPlayer) {\n    videoPlayer.src = card.dataset.video;\n    videoPlayer.poster = card.dataset.poster || '';\n    videoPlayer.preload = 'auto';\n    videoPlayer.hidden = false;\n    videoPlayer.load();\n  }"
          if old_local in text:
              text = text.replace(old_local, new_local, 1)

          script_path.write_text(text, encoding="utf-8")

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          old_tag = '<video id="project-video-player" controls playsinline preload="metadata"></video>'
          new_tag = '<video id="project-video-player" controls playsinline preload="auto" controlslist="nodownload noremoteplayback" disablepictureinpicture oncontextmenu="return false;"></video>'
          if old_tag in html:
              html = html.replace(old_tag, new_tag, 1)
          index_path.write_text(html, encoding="utf-8")
          PY

          node --check script.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
