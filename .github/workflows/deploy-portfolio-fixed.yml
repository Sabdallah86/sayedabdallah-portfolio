name: Deploy portfolio

on:
  push:
    branches: [main, hybrid-final]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4

      - name: Build hybrid portfolio with local client logos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://sayedabdallah.pages.dev/script.js" \
            --output script.js
          python tools/build_hybrid.py
          python tools/apply_client_logos.py
          python tools/apply_client_logos_v3.py
          node --check script.js

      - name: Retrieve all local media used by the portfolio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, urllib.parse, urllib.request
          base = "https://sayedabdallah.pages.dev/"
          refs = set()
          pattern = re.compile(r"assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)", re.I)
          for source in ["index.html", "styles.css", "category-pages.css", "script.js"]:
              text = Path(source).read_text(encoding="utf-8", errors="ignore")
              refs.update(pattern.findall(text))
          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists() and target.stat().st_size:
                  print("Keeping local asset", ref)
                  continue
              req = urllib.request.Request(urllib.parse.urljoin(base, ref), headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read()
                  ctype = response.headers.get("content-type", "")
              if not data or "text/html" in ctype.lower():
                  raise RuntimeError(f"Invalid media response for {ref}")
              target.write_bytes(data)
          print(f"Checked {len(refs)} local portfolio assets.")
          PY

      - name: Validate portfolio before deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="portfolio-sidebar"' index.html
          grep -q 'My Guest' index.html
          grep -q 'data-youtube="2KVyASYThgw"' index.html
          grep -q 'class="clients-v3' index.html
          grep -q 'CLIENT LOGO V3 START' styles.css
          grep -q 'SQUARE Media Production' index.html
          grep -q 'assets/client-logos/square.png' index.html
          grep -q 'assets/client-logos/al-ahly.png' index.html
          grep -q 'assets/client-logos/ciff.png' index.html
          grep -q 'assets/client-logos/kuwait-tv.png' index.html
          grep -q 'assets/client-logos/sudan-tv.png' index.html
          grep -q 'assets/client-logos/sada-el-balad.png' index.html
          grep -q 'assets/client-logos/on-sport.png' index.html
          grep -q 'assets/client-logos/good-news.png' index.html
          grep -q 'assets/client-logos/ministry-migration.png' index.html
          grep -q 'assets/client-logos/satuc.png' index.html
          grep -q 'Shasha Platform' index.html
          grep -q '37' index.html
          ! grep -q 'class="grain"' index.html
          ! grep -q 'Abu Al-Arousa' index.html
          for logo in satuc al-ahly ciff square kuwait-tv sudan-tv sada-el-balad on-sport good-news ministry-migration toto-link hospital-57357; do
            test -s "assets/client-logos/${logo}.png"
          done
          node --check script.js

      - name: Deploy production to Cloudflare Pages
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy preview to Cloudflare Pages
        if: github.ref_name != 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify final site and logo image files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then final="https://sayedabdallah.pages.dev"; else final="https://${GITHUB_REF_NAME}.sayedabdallah.pages.dev"; fi
          ok=0
          for attempt in 1 2 3 4 5 6 7; do
            curl --fail --location --silent --show-error "${final}/index.html" -o /tmp/final-index.html || true
            curl --fail --location --silent --show-error "${final}/styles.css" -o /tmp/final-styles.css || true
            if grep -q 'class="clients-v3' /tmp/final-index.html 2>/dev/null \
              && grep -q 'assets/client-logos/square.png' /tmp/final-index.html 2>/dev/null \
              && grep -q 'assets/client-logos/al-ahly.png' /tmp/final-index.html 2>/dev/null \
              && grep -q 'CLIENT LOGO V3 START' /tmp/final-styles.css 2>/dev/null; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          for logo in satuc al-ahly ciff square kuwait-tv sudan-tv sada-el-balad on-sport good-news ministry-migration toto-link hospital-57357; do
            curl --fail --location --silent --show-error -D "/tmp/${logo}.headers" "${final}/assets/client-logos/${logo}.png" -o "/tmp/${logo}.body"
            test -s "/tmp/${logo}.body"
            grep -qi '^content-type: image/' "/tmp/${logo}.headers"
            echo "LIVE OK ${logo}: $(wc -c < "/tmp/${logo}.body") bytes"
          done
          echo "CLIENT LOGO V3 LIVE VERIFICATION PASSED"
