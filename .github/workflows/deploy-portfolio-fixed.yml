name: Deploy portfolio

on:
  push:
    branches: [main, black-gold-redesign]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4

      - name: Preserve current portfolio data
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://sayedabdallah.pages.dev/script.js" \
            --output script.js
          python tools/build_redesign.py
          node --check script.js

      - name: Retrieve all local media used by the portfolio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import urllib.request

          base = "https://sayedabdallah.pages.dev/"
          sources = ["index.html", "styles.css", "category-pages.css", "script.js"]
          refs = set()
          pattern = re.compile(r"assets/[A-Za-z0-9_./-]+\.(?:webp|png|jpg|jpeg|svg|mp4|webm)", re.I)

          for source in sources:
              text = Path(source).read_text(encoding="utf-8", errors="ignore")
              refs.update(pattern.findall(text))

          for ref in sorted(refs):
              target = Path(ref)
              target.parent.mkdir(parents=True, exist_ok=True)
              url = urllib.parse.urljoin(base, ref)
              print("Downloading", ref)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  data = response.read()
                  content_type = response.headers.get("content-type", "")
              if not data:
                  raise RuntimeError(f"Empty asset: {ref}")
              if "text/html" in content_type.lower():
                  raise RuntimeError(f"Asset resolved to HTML instead of media: {ref}")
              target.write_bytes(data)

          print(f"Retrieved {len(refs)} portfolio assets.")
          PY

      - name: Validate redesign
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class="selected-showcase"' index.html
          grep -q 'My Guest with Moataz El Demerdash' index.html
          grep -q 'data-youtube="2KVyASYThgw"' index.html
          ! grep -q 'Abu Al-Arousa' index.html
          grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' script.js
          grep -q 'Amr Mostafa — My Guest with Moataz El Demerdash' script.js
          grep -q '"youtube": "2KVyASYThgw"' script.js
          grep -q '"youtube": "hyYa8IUSJJc"' script.js
          node --check script.js

      - name: Deploy production to Cloudflare Pages
        if: github.ref_name == 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy redesign preview to Cloudflare Pages
        if: github.ref_name != 'main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=sayedabdallah --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed site
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            final="https://sayedabdallah.pages.dev"
          else
            final="https://${GITHUB_REF_NAME}.sayedabdallah.pages.dev"
          fi
          for attempt in 1 2 3 4 5 6 7; do
            curl --fail --location --silent --show-error "${final}/index.html" -o /tmp/final-index.html || true
            curl --fail --location --silent --show-error "${final}/script.js" -o /tmp/final-script.js || true
            curl --fail --location --silent --show-error "${final}/styles.css" -o /tmp/final-styles.css || true

            if grep -q 'class="selected-showcase"' /tmp/final-index.html 2>/dev/null \
              && grep -q 'My Guest with Moataz El Demerdash' /tmp/final-index.html 2>/dev/null \
              && grep -q 'data-youtube="2KVyASYThgw"' /tmp/final-index.html 2>/dev/null \
              && ! grep -q 'Abu Al-Arousa' /tmp/final-index.html 2>/dev/null \
              && grep -q 'Nader Abbassy — My Guest with Moataz El Demerdash' /tmp/final-script.js 2>/dev/null \
              && grep -q -- '--sidebar:232px' /tmp/final-styles.css 2>/dev/null; then
                echo "Black-gold redesign verified successfully."
                exit 0
            fi
            sleep 4
          done
          echo "Deployment verification failed."
          exit 1
